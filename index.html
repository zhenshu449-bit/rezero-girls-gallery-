
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Re:Zero Girls Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#eee;font-family:Arial,"Microsoft YaHei",sans-serif}
header{padding:18px 12px;text-align:center;background:#191b24}
h1{font-size:23px;margin:4px}
.sub{color:#aaa;font-size:12px}
nav,.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px}
button,input{background:#292c38;color:white;border:1px solid #454958;border-radius:9px;padding:9px 12px;font-size:14px}
button{cursor:pointer}
button.active{background:#a64d83;border-color:#d77bb0}
button:disabled{opacity:.5}
#status{text-align:center;color:#aaa;padding:8px;font-size:13px}
#gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px}
.card{background:#1b1d26;border-radius:10px;overflow:hidden;min-width:0}
.card img{width:100%;height:300px;object-fit:contain;background:#08090d;display:block;cursor:zoom-in}
.actions{display:flex;gap:5px;padding:7px;flex-wrap:wrap}
.actions button{flex:1;padding:7px 3px;font-size:12px}
#loadMore{display:block;margin:14px auto 30px;padding:12px 30px}
#viewer{display:none;position:fixed;inset:0;background:#000;z-index:10;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#viewer.show{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;touch-action:none}
#closeViewer{position:absolute;right:15px;top:15px;z-index:12;background:#333}
.hint{position:absolute;bottom:15px;color:#ccc;font-size:12px}
@media(max-width:650px){
 #gallery{grid-template-columns:1fr;gap:12px;padding:10px}
 .card img{height:auto;max-height:85vh;min-height:180px}
}
</style>
</head>
<body>

<header>
<h1>🌸 Re:Zero Girls Gallery</h1>
<div class="sub">Re:Zero Female Characters Fan Gallery</div>
</header>

<nav>
<button class="active" data-view="gallery">全部图片</button>
<button data-view="favorites">❤️ 收藏页</button>
<button data-view="blocked">🚫 拉黑页</button>
</nav>

<div class="filters" id="characters">
<button class="active" data-character="all">全部角色</button>
<button data-character="emilia_(re:zero)">艾米莉亚</button>
<button data-character="rem_(re:zero)">蕾姆</button>
<button data-character="ram_(re:zero)">拉姆</button>
<button data-character="echidna_(re:zero)">艾姬多娜</button>
<button data-character="beatrice_(re:zero)">贝蒂</button>
<button data-character="felt_(re:zero)">菲鲁特</button>
<button data-character="crusch_karsten">库珥修</button>
<button data-character="anastasia_hoshin">阿纳斯塔西娅</button>
<button data-character="priscilla_barielle">普莉希拉</button>
<button data-character="frederica_baumann">弗雷德莉卡</button>
<button data-character="natsuki_schwartz">夏美</button>
<button data-character="elsa_granhiert">艾尔莎</button>
</div>

<div class="filters">
<button class="active" data-rating="all">全部分级</button>
<button data-rating="sfw">SFW</button>
<button data-rating="nsfw">NSFW</button>
</div>

<div class="filters" id="categories">
<button class="active" data-category="all">全部分类</button>
<button data-category="solo">单人</button>
<button data-category="multiple">多人</button>
<button data-category="swimsuit">泳装</button>
<button data-category="maid">女仆</button>
<button data-category="kimono">和服</button>
<button data-category="school">校服</button>
<button data-category="cosplay">Cosplay</button>
</div>

<div class="filters">
<input id="tagInput" placeholder="输入标签，例如 swimsuit">
<button id="searchBtn">搜索标签</button>
<button id="clearTag">清除标签</button>
</div>

<div id="status">正在准备画廊……</div>
<main id="gallery"></main>
<button id="loadMore">加载更多图片</button>

<div id="viewer">
<button id="closeViewer">关闭 ✕</button>
<img id="viewerImg">
<div class="hint">双指缩放 · 单指拖动 · 双击放大</div>
</div>

<script>
const API="https://danbooru.donmai.us/posts.json";
const SERIES="re:zero_kara_hajimeru_isekai_seikatsu";
const LIMIT=100;
const PAGES_PER_CLICK=5;

const CHARACTERS={
"emilia_(re:zero)":["emilia_(re:zero)","emilia"],
"rem_(re:zero)":["rem_(re:zero)","rem"],
"ram_(re:zero)":["ram_(re:zero)","ram"],
"echidna_(re:zero)":["echidna_(re:zero)","echidna"],
"beatrice_(re:zero)":["beatrice_(re:zero)","beatrice"],
"felt_(re:zero)":["felt_(re:zero)","felt"],
"crusch_karsten":["crusch_karsten"],
"anastasia_hoshin":["anastasia_hoshin"],
"priscilla_barielle":["priscilla_barielle"],
"frederica_baumann":["frederica_baumann"],
"natsuki_schwartz":["natsuki_schwartz","natsumi_schwartz"],
"elsa_granhiert":["elsa_granhiert"]
};

const CATEGORY_TAGS={
solo:["solo","1girl"],
multiple:["multiple_girls","2girls","3girls"],
swimsuit:["swimsuit","bikini"],
maid:["maid"],
kimono:["kimono","yukata"],
school:["school_uniform","serafuku","seifuku"],
cosplay:["cosplay"]
};

const $=id=>document.getElementById(id);
let posts=[];
let page=1;
let loading=false;
let exhausted=false;
let selectedCharacter="all";
let selectedRating="all";
let selectedCategory="all";
let selectedView="gallery";
let extraTag="";

function readStore(key){
 try{return JSON.parse(localStorage.getItem(key)||"[]")}
 catch(e){return []}
}
function writeStore(key,value){
 localStorage.setItem(key,JSON.stringify(value));
}
function normalizeStore(arr){
 return arr.map(x=>typeof x==="object"?x:{id:x})
 .filter(x=>x&&x.id);
}

let favorites=normalizeStore(readStore("rezeroFavorites"));
let blocked=normalizeStore(readStore("rezeroBlocked"));

function saveStores(){
 writeStore("rezeroFavorites",favorites);
 writeStore("rezeroBlocked",blocked);
}

function tagsOf(post){
 return (post.tag_string||post.tags||"").toString().split(/\s+/).filter(Boolean);
}
function hasAny(tags,options){
 return options.some(t=>tags.includes(t));
}

/* 只使用原图或高清大图，不使用低清预览图 */
function imageOf(post){
 return post.file_url||post.large_file_url||"";
}
function previewOf(post){
 return post.file_url||post.large_file_url||"";
}

function storedPost(post){
 return {
  id:String(post.id),
  image:imageOf(post),
  file_url:post.file_url||"",
  large_file_url:post.large_file_url||"",
  rating:post.rating||"s",
  tag_string:post.tag_string||post.tags||""
 };
}

function isFavorite(id){
 return favorites.some(x=>String(x.id)===String(id));
}
function isBlocked(id){
 return blocked.some(x=>String(x.id)===String(id));
}

function addToStore(arr,post){
 const item=storedPost(post);
 const index=arr.findIndex(x=>String(x.id)===String(item.id));
 if(index>=0)arr[index]=item;
 else arr.unshift(item);
 saveStores();
}
function removeFromStore(arr,id){
 return arr.filter(x=>String(x.id)!==String(id));
}

function currentList(){
 let list=[];

 if(selectedView==="favorites")list=favorites;
 else if(selectedView==="blocked")list=blocked;
 else list=posts;

 if(selectedView==="gallery"){
  list=list.filter(p=>!isBlocked(p.id));

  if(selectedCharacter!=="all"){
   const options=CHARACTERS[selectedCharacter]||[selectedCharacter];
   list=list.filter(p=>hasAny(tagsOf(p),options));
  }

  if(selectedRating==="sfw"){
   list=list.filter(p=>["s","g"].includes(p.rating));
  }
  if(selectedRating==="nsfw"){
   list=list.filter(p=>["q","e"].includes(p.rating));
  }

  if(selectedCategory!=="all"){
   const options=CATEGORY_TAGS[selectedCategory]||[];
   list=list.filter(p=>hasAny(tagsOf(p),options));
  }

  if(extraTag){
   list=list.filter(p=>tagsOf(p).some(t=>t.includes(extraTag)));
  }
 }
 return list;
}

function render(){
 const gallery=$("gallery");
 gallery.innerHTML="";
 const list=currentList();

 if(!list.length){
  gallery.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#999;padding:35px 5px">这里暂时没有图片。可以切换筛选条件或加载更多。</p>';
 }else{
  list.forEach(post=>{
   const image=post.file_url||post.large_file_url||post.image||"";
   if(!image)return;

   const card=document.createElement("article");
   card.className="card";

   const img=document.createElement("img");
   img.src=image;
   img.loading="lazy";
   img.decoding="async";
   img.alt="Re:Zero fan art";
   img.addEventListener("click",()=>openViewer(image));

   img.onerror=()=>{
    const fallback=post.large_file_url||"";
    if(fallback&&img.src!==fallback){
     img.src=fallback;
    }else{
     img.alt="图片加载失败";
    }
   };

   card.appendChild(img);

   const actions=document.createElement("div");
   actions.className="actions";

   const fav=document.createElement("button");
   fav.textContent=isFavorite(post.id)?"❤️ 已收藏":"🤍 收藏";
   fav.onclick=()=>{
    if(isFavorite(post.id)){
     favorites=removeFromStore(favorites,post.id);
    }else{
     addToStore(favorites,post);
    }
    saveStores();
    render();
   };
   actions.appendChild(fav);

   const block=document.createElement("button");
   if(selectedView==="blocked"){
    block.textContent="恢复";
    block.onclick=()=>{
     blocked=removeFromStore(blocked,post.id);
     saveStores();
     render();
    };
   }else{
    block.textContent="🚫 拉黑";
    block.onclick=()=>{
     addToStore(blocked,post);
     render();
    };
   }
   actions.appendChild(block);

   const source=document.createElement("button");
   source.textContent="原帖";
   source.onclick=()=>{
    window.open("https://danbooru.donmai.us/posts/"+post.id,"_blank");
   };
   actions.appendChild(source);

   card.appendChild(actions);
   gallery.appendChild(card);
  });
 }

 $("status").textContent=
  selectedView==="favorites"?"❤️ 收藏："+favorites.length+" 张":
  selectedView==="blocked"?"🚫 已拉黑："+blocked.length+" 张":
  "已加载 "+posts.length+" 张 · 当前显示 "+list.length+" 张";

 $("loadMore").style.display=selectedView==="gallery"?"block":"none";
 $("loadMore").disabled=loading||exhausted;
 $("loadMore").textContent=
  loading?"正在加载……":
  exhausted?"暂时没有更多图片":"加载更多图片";
}

async function loadMore(){
 if(loading||exhausted)return;

 loading=true;
 $("loadMore").disabled=true;
 $("loadMore").textContent="正在加载……";
 $("status").textContent="正在获取图片……";

 let added=0;
 let scanned=0;

 try{
  while(scanned<PAGES_PER_CLICK&&added<100){
   const params=new URLSearchParams({
    tags:SERIES+" order:id_desc",
    limit:String(LIMIT),
    page:String(page)
   });

   const response=await fetch(API+"?"+params.toString());

   if(!response.ok)throw new Error("请求失败："+response.status);

   const data=await response.json();
   scanned++;

   if(!Array.isArray(data)||data.length===0){
    exhausted=true;
    break;
   }

   page++;

   for(const post of data){
    const image=imageOf(post);
    if(!post.id||!image)continue;
    if(posts.some(p=>String(p.id)===String(post.id)))continue;

    posts.push({
     ...post,
     id:String(post.id),
     image:image,
     file_url:post.file_url||"",
     large_file_url:post.large_file_url||""
    });
    added++;
   }

   if(data.length<LIMIT){
    exhausted=true;
    break;
   }
  }

  $("status").textContent="本次新增 "+added+" 张图片";
 }catch(error){
  $("status").textContent="加载失败或超时，请稍后重试。";
 }finally{
  loading=false;
  render();
 }
}

function setActive(container,attribute,value){
 container.querySelectorAll("button").forEach(btn=>{
  btn.classList.toggle("active",btn.dataset[attribute]===value);
 });
}

$("characters").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-character]");
 if(!btn)return;
 selectedCharacter=btn.dataset.character;
 setActive($("characters"),"character",selectedCharacter);
 render();
});

$("categories").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-category]");
 if(!btn)return;
 selectedCategory=btn.dataset.category;
 setActive($("categories"),"category",selectedCategory);
 render();
});

document.querySelectorAll("[data-rating]").forEach(btn=>{
 btn.onclick=()=>{
  selectedRating=btn.dataset.rating;
  document.querySelectorAll("[data-rating]").forEach(b=>{
   b.classList.toggle("active",b===btn);
  });
  render();
 };
});

document.querySelectorAll("[data-view]").forEach(btn=>{
 btn.onclick=()=>{
  selectedView=btn.dataset.view;
  document.querySelectorAll("[data-view]").forEach(b=>{
   b.classList.toggle("active",b===btn);
  });
  render();
 };
});

$("searchBtn").onclick=()=>{
 extraTag=$("tagInput").value.trim().toLowerCase().replace(/\s+/g,"_");
 selectedView="gallery";
 document.querySelectorAll("[data-view]").forEach(b=>{
  b.classList.toggle("active",b.dataset.view==="gallery");
 });
 render();
};

$("clearTag").onclick=()=>{
 $("tagInput").value="";
 extraTag="";
 render();
};

$("loadMore").onclick=loadMore;

/* 图片查看器 */
const viewer=$("viewer");
const viewerImg=$("viewerImg");

let scale=1;
let moveX=0;
let moveY=0;
let startX=0;
let startY=0;
let pointers=new Map();
let pinchStart=0;
let pinchScale=1;

function updateTransform(){
 viewerImg.style.transform=
  `translate(${moveX}px,${moveY}px) scale(${scale})`;
}

function openViewer(src){
 if(!src)return;
 scale=1;
 moveX=0;
 moveY=0;
 viewerImg.src=src;
 updateTransform();
 viewer.classList.add("show");
}

function closeViewer(){
 viewer.classList.remove("show");
 viewerImg.src="";
 pointers.clear();
}

$("closeViewer").onclick=closeViewer;

viewer.addEventListener("click",e=>{
 if(e.target===viewer)closeViewer();
});

viewerImg.addEventListener("dblclick",()=>{
 scale=scale===1?2.5:1;
 if(scale===1){moveX=0;moveY=0}
 updateTransform();
});

viewerImg.addEventListener("pointerdown",e=>{
 viewerImg.setPointerCapture(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(pointers.size===1){
  startX=e.clientX-moveX;
  startY=e.clientY-moveY;
 }else if(pointers.size===2){
  const pts=[...pointers.values()];
  pinchStart=Math.hypot(
   pts[0].x-pts[1].x,
   pts[0].y-pts[1].y
  );
  pinchScale=scale;
 }
});

viewerImg.addEventListener("pointermove",e=>{
 if(!pointers.has(e.pointerId))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(pointers.size===1&&scale>1){
  moveX=e.clientX-startX;
  moveY=e.clientY-startY;
  updateTransform();
 }else if(pointers.size===2){
  const pts=[...pointers.values()];
  const distance=Math.hypot(
   pts[0].x-pts[1].x,
   pts[0].y-pts[1].y
  );

  if(pinchStart>0){
   scale=Math.max(1,Math.min(6,pinchScale*distance/pinchStart));
   updateTransform();
  }
 }
});

function releasePointer(e){
 pointers.delete(e.pointerId);
}
viewerImg.addEventListener("pointerup",releasePointer);
viewerImg.addEventListener("pointercancel",releasePointer);

loadMore();
</script>
</body>
</html>
