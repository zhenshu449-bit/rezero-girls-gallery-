from pathlib import Path
p=Path("/mnt/data/index.html")

<meta charset="UTF-8">

*{box-sizing:border-box}body{margin:0;background:#101318;color:#eee;font-family:system-ui,-apple-system,sans-serif}

let rating="",char="",cat="",page=1,loading=false,seen=new Set();
function buttons(obj,box,fn){for(const[n,v]of Object.entries(obj)){let b=document.createElement("button");b.textContent=n;if(!v)b.className="on";b.onclick=()=>{box.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");fn(v)};box.appendChild(b)}}
