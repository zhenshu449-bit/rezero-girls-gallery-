@media(min-width:700px){
  #gallery{
    grid-template-columns:repeat(3,1fr);

<script>

const API =
"https://danbooru.donmai.us/posts.json";

/*
  Re:Zero 作品标签
*/
const BASE =
"re:zero";


/*
  每次加载数量
*/
const PER_PAGE = 40;


/*
  防止一次请求加载过多
*/
const REQUEST_TIMEOUT = 12000;


let page = 1;

let loading = false;

let controller = null;

let currentRating = "all";

let currentGirl = "";

let currentCategory = "";

let currentSearch = "";

let showBlocked = false;

let showFavorites = false;

let noMoreData = false;

let posts = [];


const blockedKey =
"rezeroBlockedIds";

const favKey =
"rezeroFavorites";


let blockedIds =
JSON.parse(
localStorage.getItem(blockedKey) || "[]"
).map(String);


let favorites =
JSON.parse(
localStorage.getItem(favKey) || "[]"
).map(String);


const gallery =
document.getElementById("gallery");

const status =
document.getElementById("status");

const loadMore =
document.getElementById("loadMore");


/* =========================
   本地存储
========================= */

function saveBlocked(){

  localStorage.setItem(
    blockedKey,
    JSON.stringify(blockedIds)
  );

}


function saveFavorites(){

  localStorage.setItem(
    favKey,
    JSON.stringify(favorites)
  );

}


function isBlocked(id){

  return blockedIds.includes(
    String(id)
  );

}


function isFavorite(id){

  return favorites.includes(
    String(id)
  );

}


/* =========================
   收藏
========================= */

function toggleFavorite(id){

  id = String(id);

  if(isFavorite(id)){

    favorites =
      favorites.filter(
        x => x !== id
      );

  }else{

    favorites.push(id);

  }

  saveFavorites();

  render();

}


/* =========================
   拉黑
========================= */

function blockPost(id){

  id = String(id);

  if(!isBlocked(id)){

    blockedIds.push(id);

    saveBlocked();

  }

  render();

}


function unblockPost(id){

  id = String(id);

  blockedIds =
    blockedIds.filter(
      x => x !== id
    );

  saveBlocked();

  render();

}


/* =========================
   Rating
========================= */

function getRating(post){

  if(
    post.rating === "s" ||
    post.rating === "g"
  ){

    return "SFW";

  }

  return "NSFW";

}


/* =========================
   标签
========================= */

function getTags(post){

  return String(
    post.tag_string || ""
  )
  .toLowerCase()
  .split(" ");

}


function hasTag(post, tag){

  if(!tag){
    return true;
  }

  return getTags(post)
    .includes(
      tag.toLowerCase()
    );

}


/* =========================
   分类
========================= */

function matchesCategory(post){

  if(!currentCategory){
    return true;
  }

  const tags =
    getTags(post);


  if(
    currentCategory === "solo"
  ){

    return tags.includes("solo");

  }


  if(
    currentCategory === "multiple_girls"
  ){

    return (
      tags.includes("multiple_girls") ||
      tags.includes("multiple_person") ||
      tags.includes("group")
    );

  }


  if(
    currentCategory === "swimsuit"
  ){

    return (
      tags.includes("swimsuit") ||
      tags.includes("bikini")
    );

  }


  if(
    currentCategory === "maid"
  ){

    return tags.includes("maid");

  }


  if(
    currentCategory === "kimono"
  ){

    return (
      tags.includes("kimono") ||
      tags.includes("yukata")
    );

  }


  if(
    currentCategory === "school_uniform"
  ){

    return (
      tags.includes("school_uniform") ||
      tags.includes("serafuku") ||
      tags.includes("seifuku")
    );

  }


  if(
    currentCategory === "cosplay"
  ){

    return tags.includes("cosplay");

  }


  return true;

}


/* =========================
   搜索
========================= */

function matchesSearch(post){

  if(!currentSearch){
    return true;
  }

  return String(
    post.tag_string || ""
  )
  .toLowerCase()
  .includes(
    currentSearch.toLowerCase()
  );

}


/* =========================
   判断图片
========================= */

function matchesPost(post){

  if(showFavorites){

    if(
      !isFavorite(post.id)
    ){
      return false;
    }

  }


  if(showBlocked){

    if(
      !isBlocked(post.id)
    ){
      return false;
    }

  }else{

    if(
      isBlocked(post.id)
    ){
      return false;
    }

  }


  if(
    !showFavorites &&
    currentRating !== "all"
  ){

    if(
      currentRating === "s" &&
      post.rating !== "s" &&
      post.rating !== "g"
    ){

      return false;

    }


    if(
      currentRating === "q" &&
      (
        post.rating === "s" ||
        post.rating === "g"
      )
    ){

      return false;

    }

  }


  if(
    currentGirl &&
    !hasTag(
      post,
      currentGirl
    )
  ){

    return false;

  }


  if(
    !matchesCategory(post)
  ){

    return false;

  }


  if(
    !matchesSearch(post)
  ){

    return false;

  }


  return true;

}


/* =========================
   图片地址
========================= */

function imageUrl(post){

  return (
    post.large_file_url ||
    post.file_url ||
    post.preview_file_url
  );

}


/* =========================
   渲染
========================= */

function render(){

  gallery.innerHTML = "";


  const visible =
    posts.filter(matchesPost);


  if(showFavorites){

    status.textContent =
      "⭐ 收藏 "+visible.length+" 张";

  }else if(showBlocked){

    status.textContent =
      "🚫 已拉黑 "+visible.length+" 张";

  }


  if(!visible.length){

    let text =
      "这里暂时没有符合条件的图片 🥲";


    if(showFavorites){

      text =
        "还没有收藏图片 ⭐";

    }


    if(showBlocked){

      text =
        "没有拉黑图片 🚫";

    }


    gallery.innerHTML =
      `<div class="empty">${text}</div>`;

    return;

  }


  visible.forEach(post => {

    const card =
      document.createElement("div");

    card.className = "card";


    const img =
      document.createElement("img");

    img.loading = "lazy";

    img.src =
      imageUrl(post);

    img.alt =
      "Re:Zero";

    img.onclick = () =>
      openViewer(
        imageUrl(post)
      );


    img.onerror = () => {

      img.style.display = "none";

    };


    const info =
      document.createElement("div");

    info.className = "info";


    const tagText =
      String(
        post.tag_string || ""
      )
      .split(" ")
      .slice(0,20)
      .join(" ");


    info.innerHTML = `

      <div class="tags">
        ${getRating(post)} · ${tagText}
      </div>

      <div class="actions">

        <button class="viewBtn">
          查看
        </button>

        <button class="favBtn">
          ${
            isFavorite(post.id)
            ? "⭐ 已收藏"
            : "☆ 收藏"
          }
        </button>

        ${
          isBlocked(post.id)

          ? `
            <button class="unblockBtn">
              解除拉黑
            </button>
          `

          : `
            <button class="blockBtn">
              🚫 拉黑
            </button>
          `
        }

        <button class="sourceBtn">
          原帖
        </button>

      </div>
    `;


    info.querySelector(
      ".viewBtn"
    ).onclick = () =>
      openViewer(
        imageUrl(post)
      );


    info.querySelector(
      ".favBtn"
    ).onclick = () =>
      toggleFavorite(
        post.id
      );


    const blockButton =
      info.querySelector(
        ".blockBtn"
      ) ||
      info.querySelector(
        ".unblockBtn"
      );


    if(blockButton){

      blockButton.onclick = () => {

        if(
          isBlocked(post.id)
        ){

          unblockPost(
            post.id
          );

        }else{

          blockPost(
            post.id
          );

        }

      };

    }


    info.querySelector(
      ".sourceBtn"
    ).onclick = () => {

      window.open(
        "https://danbooru.donmai.us/posts/" +
        post.id,
        "_blank"
      );

    };


    card.appendChild(img);

    card.appendChild(info);

    gallery.appendChild(card);

  });

}


/* =========================
   查询条件
========================= */

function buildTags(){

  let tags = [BASE];


  if(currentGirl){

    tags.push(
      currentGirl
    );

  }


  if(currentCategory){

    tags.push(
      currentCategory
    );

  }


  if(
    currentRating === "s"
  ){

    tags.push(
      "rating:s"
    );

  }


  if(
    currentRating === "q"
  ){

    tags.push(
      "rating:q"
    );

  }


  return tags.join(" ");

}


/* =========================
   稳定加载
========================= */

async function fetchPosts(
  reset = false
){

  /*
    防止疯狂点击
  */
  if(loading){
    return;
  }


  /*
    收藏页 / 拉黑页不需要重新请求
  */
  if(
    (showFavorites ||
     showBlocked) &&
    !reset
  ){

    render();

    return;

  }


  loading = true;

  loadMore.disabled = true;

  loadMore.textContent =
    "正在加载……";


  /*
    取消旧请求
  */
  if(controller){

    controller.abort();

  }


  controller =
    new AbortController();


  const thisController =
    controller;


  const timeout =
    setTimeout(() => {

      thisController.abort();

    },REQUEST_TIMEOUT);


  if(reset){

    page = 1;

    noMoreData = false;

    posts = [];

    gallery.innerHTML = "";

  }


  status.textContent =
    "正在加载图片……";


  try{

    const params =
      new URLSearchParams();


    params.set(
      "tags",
      buildTags()
    );


    params.set(
      "limit",
      String(PER_PAGE)
    );


    params.set(
      "page",
      String(page)
    );


    const response =
      await fetch(
        API +
        "?" +
        params.toString(),
        {
          signal:
            thisController.signal
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP "+response.status
      );

    }


    const data =
      await response.json();


    clearTimeout(timeout);


    /*
      如果已经没有新数据
    */
    if(
      !Array.isArray(data) ||
      data.length === 0
    ){

      noMoreData = true;

      status.textContent =
        "已经没有更多图片了 📭";

      loadMore.textContent =
        "没有更多了";

      loadMore.disabled = true;

      loading = false;

      return;

    }


    /*
      去重
    */
    const existing =
      new Set(
        posts.map(
          x => String(x.id)
        )
      );


    let added = 0;


    data.forEach(post => {

      const id =
        String(post.id);


      if(
        !existing.has(id)
      ){

        posts.push(post);

        existing.add(id);

        added++;

      }

    });


    /*
      进入下一页
    */
    page++;


    render();


    status.textContent =
      "已加载 "+posts.length+" 张";


    /*
      如果这一页全是重复数据
    */
    if(
      added === 0
    ){

      noMoreData = true;

      loadMore.textContent =
        "没有更多了";

      loadMore.disabled = true;

    }else{

      loadMore.textContent =
        "加载更多";

      loadMore.disabled = false;

    }


  }catch(error){

    clearTimeout(timeout);


    if(
      error.name === "AbortError"
    ){

      status.textContent =
        "请求超时，请再点一次加载更多 😵";

    }else{

      status.textContent =
        "加载失败，请再试一次 😵";

    }


    loadMore.textContent =
      "重新加载";

    loadMore.disabled =
      false;


  }finally{

    loading = false;

  }

}


/* =========================
   SFW / NSFW
========================= */

document

    document
    .getElementById(

document

    currentSearch =

const viewerImg =

let posX = 0;

let posY = 0;

let dragging = false;

let startX = 0;

let startY = 0;


function updateViewer(){

  viewerImg.style.transform =
    `translate(
      calc(-50% + ${posX}px),
      calc(-50% + ${posY}px)
    ) scale(${scale})`;

}


function openViewer(src){

  viewer.classList.add(
    "show"
  );


  viewerImg.src = src;


  scale = 1;

  posX = 0;

  posY = 0;


  updateViewer();

}


function closeViewer(){

  viewer.classList.remove(
    "show"
  );


  viewerImg.src = "";

}


document
.getElementById(
  "closeViewer"
)
.onclick = closeViewer;


viewer.onclick = event => {

  if(
    event.target === viewer
  ){

    closeViewer();

  }

};


/* =========================
   双击缩放
========================= */

viewerImg.addEventListener(
  "dblclick",
  () => {

    if(scale === 1){

      scale = 2;

    }else{

      scale = 1;

      posX = 0;

      posY = 0;

    }


    updateViewer();

  }
);


/* =========================
   单指拖动
========================= */

viewerImg.addEventListener(
  "pointerdown",
  event => {

    dragging = true;

    startX =
      event.clientX - posX;

    startY =
      event.clientY - posY;


    viewerImg.setPointerCapture(
      event.pointerId
    );

  }
);


viewerImg.addEventListener(
  "pointermove",
  event => {

    if(!dragging){
      return;
    }


    posX =
      event.clientX - startX;

    posY =
      event.clientY - startY;


    updateViewer();

  }
);


viewerImg.addEventListener(
  "pointerup",
  () => {

    dragging = false;

  }
);


viewerImg.addEventListener(
  "pointercancel",
  () => {

    dragging = false;

  }
);


/* =========================
   双指缩放
========================= */

let pinchStartDistance = 0;

let pinchStartScale = 1;


viewerImg.addEventListener(
  "touchstart",
  event => {

    if(
      event.touches.length === 2
    ){

      event.preventDefault();


      pinchStartDistance =
        getDistance(
          event.touches[0],
          event.touches[1]
        );


      pinchStartScale =
        scale;

    }

  },
  {
    passive:false
  }
);


viewerImg.addEventListener(
  "touchmove",
  event => {

    if(
      event.touches.length === 2
    ){

      event.preventDefault();


      const distance =
        getDistance(
          event.touches[0],
          event.touches[1]
        );


      scale =
        pinchStartScale *
        (
          distance /
          pinchStartDistance
        );


      scale =
        Math.max(
          1,
          Math.min(
            scale,
            5
          )
        );


      updateViewer();

    }

  },
  {
    passive:false
  }
);


function getDistance(a,b){

  const dx =
    a.clientX - b.clientX;

  const dy =
    a.clientY - b.clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================
   ESC关闭
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeViewer();

    }

  }
);


/* =========================
   首次加载
========================= */

fetchPosts(true);

</script>
