from pathlib import Path

html = r'''<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🌸 Re:Zero Girls Gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101318;color:#eee;font-family:system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;background:#171a20ee;backdrop-filter:blur(10px);padding:14px}
h1{font-size:22px;margin:0 0 12px}.bar{display:flex;gap:7px;overflow:auto}
button,input{border:0;border-radius:10px;padding:10px 12px;background:#252a33;color:#fff}
button{cursor:pointer;white-space:nowrap}button.on{background:#8b6cff}
input{width:100%;margin:8px 0}
#grid{display:grid;grid-template-columns:1fr;gap:12px;padding:12px}
.card{background:#191d24;border-radius:12px;overflow:hidden;position:relative}
.card img{width:100%;display:block;max-height:none;object-fit:contain;background:#0b0d10}
.actions{display:flex;gap:6px;padding:8px}.actions button{flex:1;font-size:13px}
#more{display:block;margin:8px auto 20px}
#viewer{position:fixed;inset:0;background:#000;z-index:20;display:none;touch-action:none}
#viewer img{position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;transform:translate(-50%,-50%) scale(1);transform-origin:center;user-select:none}
#close{position:absolute;right:14px;top:14px;z-index:3;font-size:22px;background:#222c}
#status{text-align:center;padding:10px;color:#aaa;font-size:13px}
@media(min-width:700px){#grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<h1>🌸 Re:Zero Girls Gallery</h1>
<div class="bar" id="chars"></div>
<div class="bar" id="cats"></div>
<input id="search" placeholder="输入标签，例如 swimsuit">
</header>
<div id="status">正在加载…</div>
<main id="grid"></main>
<button id="more">加载更多</button>

<div id="viewer"><button id="close">✕</button><img id="vimg"></div>

<script>
const API="https://danbooru.donmai.us/posts.json";
const girls={
"全部":"",
"艾米莉亚":"emilia_(re:zero)",
"蕾姆":"rem_(re:zero)",
"拉姆":"ram_(re:zero)",
"艾姬多娜":"echidna_(re:zero)",
"贝蒂":"beatrice_(re:zero)",
"菲鲁特":"felt_(re:zero)",
"库珥修":"crusch_karsten",
"阿纳斯塔西娅":"anastasia_hoshin",
"普莉希拉":"priscilla_barielle",
"弗雷德莉卡":"frederica_baumann",
"佩特拉":"petra_lete"
};
const cats={
"全部":"","单人":"solo","多人":"multiple_girls",
"泳装":"swimsuit","女仆":"maid","和服":"kimono",
"校服":"school_uniform","Cosplay":"cosplay"
};
let char="",cat="",page=1,loading=false,seen=new Set();
const grid=document.querySelector("#grid"),status=document.querySelector("#status");
function makeButtons(obj,box,fn){
 for(const [name,val] of Object.entries(obj)){
  const b=document.createElement("button");b.textContent=name;
  if(!val)b.classList.add("on");
  b.onclick=()=>{box.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");fn(val);};
  box.appendChild(b);
 }
}
makeButtons(girls,document.querySelector("#chars"),v=>{char=v;reset()});
makeButtons(cats,document.querySelector("#cats"),v=>{cat=v;reset()});
document.querySelector("#search").oninput=()=>{clearTimeout(window.t);window.t=setTimeout(reset,400)};
function reset(){page=1;seen.clear();grid.innerHTML="";load()}
async function load(){
 if(loading)return;loading=true;status.textContent="正在加载…";
 let tags=[char,cat,document.querySelector("#search").value.trim(),"rating:safe"].filter(Boolean).join(" ");
 try{
  const r=await fetch(`${API}?limit=100&page=${page}&tags=${encodeURIComponent(tags)}`);
  const data=await r.json();
  let added=0;
  for(const p of data){
   if(!p.file_url||seen.has(p.id))continue;seen.add(p.id);added++;
   const c=document.createElement("article");c.className="card";
   c.innerHTML=`<img loading="lazy" src="${p.large_file_url||p.file_url}" alt="">
   <div class="actions"><button class="view">查看</button>
   <button class="fav">❤️ 收藏</button>
   <button class="src">原帖</button></div>`;
   c.querySelector(".view").onclick=()=>openViewer(p.large_file_url||p.file_url);
   c.querySelector(".src").onclick=()=>location.href="https://danbooru.donmai.us/posts/"+p.id;
   c.querySelector(".fav").onclick=e=>{
    const a=JSON.parse(localStorage.favs||"[]");const id=String(p.id);
    const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);localStorage.favs=JSON.stringify(a);
    e.target.textContent=i<0?"❤️ 已收藏":"❤️ 收藏";
   };
   grid.appendChild(c);
  }
  status.textContent=`本页新增 ${added} 张`;
  page++;
 }catch(e){status.textContent="加载失败，请检查网络后重试"}
 loading=false;
}
document.querySelector("#more").onclick=load;
const viewer=document.querySelector("#viewer"),vimg=document.querySelector("#vimg");
let scale=1,lastDist=0,dx=0,dy=0,sx=0,sy=0,moving=false;
function openViewer(url){vimg.src=url;scale=1;dx=dy=0;viewer.style.display="block";apply()}
function apply(){vimg.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${scale})`}
document.querySelector("#close").onclick=()=>viewer.style.display="none";
viewer.addEventListener("dblclick",()=>{scale=scale>1?1:2;dx=dy=0;apply()});
viewer.addEventListener("touchstart",e=>{
 if(e.touches.length===1){moving=true;sx=e.touches[0].clientX-dx;sy=e.touches[0].clientY-dy}
 if(e.touches.length===2)lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
},{passive:false});
viewer.addEventListener("touchmove",e=>{
 e.preventDefault();
 if(e.touches.length===2){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  scale=Math.max(.5,Math.min(5,scale*d/lastDist));lastDist=d;apply();
 }else if(moving&&scale>1){dx=e.touches[0].clientX-sx;dy=e.touches[0].clientY-sy;apply()}
},{passive:false});
load();
</script>
</body>
</html>'''
p=Path("/mnt/data/index.html")
p.write_text(html,encoding="utf-8")
print(f"[下载 index.html](sandbox:{p})")
