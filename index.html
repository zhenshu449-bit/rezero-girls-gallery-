<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🌿 Re:Zero Girls Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:Arial,"Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:20;background:#181818;padding:12px;border-bottom:1px solid #333}
h1{text-align:center;margin:0 0 10px;font-size:22px}
.controls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
button{border:0;border-radius:8px;padding:8px 11px;background:#292929;color:#fff;cursor:pointer}
button.active{background:#6c4cff}
.search{width:100%;margin-top:8px;padding:10px;border:1px solid #444;border-radius:8px;background:#222;color:#fff}
#status{text-align:center;padding:10px;color:#aaa}
#gallery{width:100%;max-width:1100px;margin:auto;padding:10px;display:grid;grid-template-columns:1fr;gap:12px}
.card{background:#1c1c1c;border-radius:10px;overflow:hidden;border:1px solid #292929}
.card img{display:block;width:100%;height:auto;cursor:pointer}
.info{padding:8px}
.tags{color:#aaa;font-size:12px;line-height:1.5;word-break:break-word}
.actions{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.actions button{width:100%;font-size:13px}
.load{display:block;margin:15px auto 30px;padding:11px 30px;background:#6c4cff}
.viewer{position:fixed;inset:0;z-index:999;display:none;background:rgba(0,0,0,.96);touch-action:none;overflow:hidden}
.viewer.show{display:block}
.viewer img{position:absolute;left:50%;top:50%;max-width:96vw;max-height:94vh;transform:translate(-50%,-50%) scale(1);user-select:none;-webkit-user-drag:none;touch-action:none}
.close{position:fixed;right:12px;top:12px;z-index:1001;font-size:20px;width:44px;height:44px;border-radius:50%;background:rgba(50,50,50,.8)}
.viewerHint{position:fixed;bottom:15px;left:0;right:0;text-align:center;color:#aaa;font-size:12px;pointer-events:none}
.empty{text-align:center;padding:40px 10px;color:#888}
@media(min-width:700px){#gallery{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<body>

<header>
<h1>🌿 Re:Zero Girls Gallery</h1>

<div class="controls">
<button class="rating active" data-rating="all">全部</button>
<button class="rating" data-rating="s">SFW</button>
<button class="rating" data-rating="q">NSFW</button>
<button id="favBtn">⭐ 收藏页</button>
<button id="blockedBtn">🚫 已拉黑</button>
<button id="clearBlocked">清空拉黑</button>
</div>

<div class="controls" id="girls">
<button class="girl active" data-tag="">全部</button>
<button class="girl" data-tag="emilia">艾米莉亚</button>
<button class="girl" data-tag="rem">蕾姆</button>
<button class="girl" data-tag="ram">拉姆</button>
<button class="girl" data-tag="echidna">艾姬多娜</button>
<button class="girl" data-tag="beatrice">贝蒂</button>
<button class="girl" data-tag="felt">菲鲁特</button>
<button class="girl" data-tag="crusch_karsten">库珥修</button>
<button class="girl" data-tag="anastasia_hoshin">阿纳斯塔西娅</button>
<button class="girl" data-tag="priscilla_barielle">普莉希拉</button>
<button class="girl" data-tag="frederica_baumann">弗雷德莉卡</button>
<button class="girl" data-tag="natsumi_schwartz">夏美</button>
<button class="girl" data-tag="elsa_granhiert">艾尔莎</button>
</div>

<div class="controls" id="categories">
<button class="category active" data-tag="">全部</button>
<button class="category" data-tag="solo">单人</button>
<button class="category" data-tag="multiple_girls">多人</button>
<button class="category" data-tag="swimsuit">泳装</button>
<button class="category" data-tag="maid">女仆</button>
<button class="category" data-tag="kimono">和服</button>
<button class="category" data-tag="school_uniform">校服</button>
<button class="category" data-tag="cosplay">Cosplay</button>
</div>

<input id="tagSearch" class="search" placeholder="输入标签，例如 swimsuit">
</header>

<div id="status">准备加载……</div>
<div id="gallery"></div>
<button id="loadMore" class="load">加载更多</button>

<div id="viewer" class="viewer">
<button id="closeViewer" class="close">✕</button>
<img id="viewerImg">
<div class="viewerHint">双指缩放 · 单指拖动 · 双击放大</div>
</div>

<script>
const API="https://danbooru.donmai.us/posts.json";
const BASE="re:zero";
const PER_PAGE=60;

let page=1;
let loading=false;
let controller=null;

let currentRating="all";
let currentGirl="";
let currentCategory="";
let currentSearch="";
let showBlocked=false;
let showFavorites=false;

let posts=[];

const blockedKey="rezeroBlockedIds";
const favKey="rezeroFavorites";

let blockedIds=JSON.parse(localStorage.getItem(blockedKey)||"[]").map(String);
let favorites=JSON.parse(localStorage.getItem(favKey)||"[]").map(String);

const gallery=document.getElementById("gallery");
const status=document.getElementById("status");
const loadMore=document.getElementById("loadMore");

function saveBlocked(){
localStorage.setItem(blockedKey,JSON.stringify(blockedIds.map(String)));
}

function saveFavorites(){
localStorage.setItem(favKey,JSON.stringify(favorites.map(String)));
}

function isBlocked(id){
return blockedIds.includes(String(id));
}

function isFavorite(id){
return favorites.includes(String(id));
}

function toggleFavorite(id){
id=String(id);

if(isFavorite(id)){
favorites=favorites.filter(x=>x!==id);
}else{
favorites.push(id);
}

saveFavorites();
render();
}

function blockPost(id){
id=String(id);

if(!isBlocked(id)){
blockedIds.push(id);
saveBlocked();
}

render();
}

function unblockPost(id){
id=String(id);
blockedIds=blockedIds.filter(x=>x!==id);
saveBlocked();
render();
}

function getRating(post){
return(post.rating==="s"||post.rating==="g")?"SFW":"NSFW";
}

function hasTag(post,tag){
if(!tag)return true;

const tags=String(post.tag_string||"")
.toLowerCase()
.split(" ");

return tags.includes(tag.toLowerCase());
}

function matchesCategory(post){
if(!currentCategory)return true;

const tags=String(post.tag_string||"")
.toLowerCase()
.split(" ");

if(currentCategory==="solo")
return tags.includes("solo");

if(currentCategory==="multiple_girls")
return tags.includes("multiple_girls")||
tags.includes("multiple_person")||
tags.includes("group");

if(currentCategory==="swimsuit")
return tags.includes("swimsuit")||
tags.includes("bikini");

if(currentCategory==="maid")
return tags.includes("maid");

if(currentCategory==="kimono")
return tags.includes("kimono")||
tags.includes("yukata");

if(currentCategory==="school_uniform")
return tags.includes("school_uniform")||
tags.includes("serafuku")||
tags.includes("seifuku");

if(currentCategory==="cosplay")
return tags.includes("cosplay");

return true;
}

function matchesSearch(post){
if(!currentSearch)return true;

return String(post.tag_string||"")
.toLowerCase()
.includes(currentSearch.toLowerCase());
}

function matchesPost(post){

if(showFavorites){
if(!isFavorite(post.id))return false;
}

if(showBlocked){
if(!isBlocked(post.id))return false;
}else{
if(isBlocked(post.id))return false;
}

if(!showFavorites&&currentRating!=="all"){

if(currentRating==="s"&&
post.rating!=="s"&&
post.rating!=="g"){
return false;
}

if(currentRating==="q"&&
(post.rating==="s"||post.rating==="g")){
return false;
}
}

if(currentGirl&&!hasTag(post,currentGirl))
return false;

if(!matchesCategory(post))
return false;

if(!matchesSearch(post))
return false;

return true;
}

function imageUrl(post){
return post.large_file_url||
post.file_url||
post.preview_file_url;
}

function render(){

gallery.innerHTML="";

const visible=posts.filter(matchesPost);

if(showFavorites){
status.textContent="⭐ 收藏 "+visible.length+" 张";
}

if(showBlocked){
status.textContent="🚫 已拉黑 "+visible.length+" 张";
}

if(!visible.length){

gallery.innerHTML=
'<div class="empty">'+
(showFavorites?
"还没有收藏图片 ⭐":
showBlocked?
"没有拉黑图片 🚫":
"这里暂时没有符合条件的图片 🥲")+
'</div>';

return;
}

visible.forEach(post=>{

const card=document.createElement("div");
card.className="card";

const img=document.createElement("img");
img.loading="lazy";
img.src=imageUrl(post);
img.alt="Re:Zero";
img.onclick=()=>openViewer(imageUrl(post));

const info=document.createElement("div");
info.className="info";

const tagText=String(post.tag_string||"")
.split(" ")
.slice(0,20)
.join(" ");

info.innerHTML=`
<div class="tags">
${getRating(post)} · ${tagText}
</div>

<div class="actions">

<button class="viewBtn">查看</button>

<button class="favBtn">
${isFavorite(post.id)?"⭐ 已收藏":"☆ 收藏"}
</button>

${
isBlocked(post.id)
?'<button class="unblockBtn">解除拉黑</button>'
:'<button class="blockBtn">🚫 拉黑</button>'
}

<button class="sourceBtn">原帖</button>

</div>
`;

info.querySelector(".viewBtn")
.onclick=()=>openViewer(imageUrl(post));

info.querySelector(".favBtn")
.onclick=()=>toggleFavorite(post.id);

const blockButton=
info.querySelector(".blockBtn")||
info.querySelector(".unblockBtn");

if(blockButton){
blockButton.onclick=()=>{
if(isBlocked(post.id)){
unblockPost(post.id);
}else{
blockPost(post.id);
}
};
}

info.querySelector(".sourceBtn")
.onclick=()=>{
window.open(
"https://danbooru.donmai.us/posts/"+post.id,
"_blank"
);
};

card.appendChild(img);
card.appendChild(info);
gallery.appendChild(card);

});
}

function buildTags(){

let tags=[BASE];

if(currentGirl)
tags.push(currentGirl);

if(currentCategory){

if(currentCategory==="solo")
tags.push("solo");

if(currentCategory==="multiple_girls")
tags.push("multiple_girls");

if(currentCategory==="swimsuit")
tags.push("swimsuit");

if(currentCategory==="maid")
tags.push("maid");

if(currentCategory==="kimono")
tags.push("kimono");

if(currentCategory==="school_uniform")
tags.push("school_uniform");

if(currentCategory==="cosplay")
tags.push("cosplay");
}

if(currentRating==="s")
tags.push("rating:s");

if(currentRating==="q")
tags.push("rating:q");

return tags.join(" ");
}

async function fetchPosts(reset=false){

if(loading)return;

loading=true;

if(controller)
controller.abort();

controller=new AbortController();

const timeout=setTimeout(()=>{
controller.abort();
},12000);

if(reset){
page=1;
posts=[];
gallery.innerHTML="";
}

status.textContent="正在加载图片……";

let success=false;

for(let attempt=1;attempt<=2;attempt++){

try{

const params=new URLSearchParams();

params.set("tags",buildTags());
params.set("limit",PER_PAGE);
params.set("page",page);

const response=await fetch(
API+"?"+params.toString(),
{signal:controller.signal}
);

if(!response.ok)
throw new Error("HTTP "+response.status);

const data=await response.json();

clearTimeout(timeout);

const existing=new Set(
posts.map(x=>String(x.id))
);

data.forEach(x=>{
if(!existing.has(String(x.id))){
posts.push(x);
}
});

page++;
success=true;

render();

if(!showFavorites&&!showBlocked){
status.textContent="已加载 "+posts.length+" 张";
}

break;

}catch(err){

if(attempt===2){

clearTimeout(timeout);

if(!showFavorites&&!showBlocked)
status.textContent="加载失败，请稍后再试 😵";

}
}
}

loading=false;
}

document.querySelectorAll(".rating").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll(".rating")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

currentRating=btn.dataset.rating;
showBlocked=false;
showFavorites=false;

document.getElementById("blockedBtn")
.classList.remove("active");

document.getElementById("favBtn")
.classList.remove("active");

fetchPosts(true);

};
});

document.querySelectorAll(".girl").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll(".girl")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

currentGirl=btn.dataset.tag;
showBlocked=false;
showFavorites=false;

document.getElementById("blockedBtn")
.classList.remove("active");

document.getElementById("favBtn")
.classList.remove("active");

fetchPosts(true);

};
});

document.querySelectorAll(".category").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

currentCategory=btn.dataset.tag;
showBlocked=false;
showFavorites=false;

document.getElementById("blockedBtn")
.classList.remove("active");

document.getElementById("favBtn")
.classList.remove("active");

fetchPosts(true);

};
});

document.getElementById("tagSearch")
.addEventListener("input",e=>{
currentSearch=e.target.value.trim();
render();
});


/* 收藏页 */

document.getElementById("favBtn")
.onclick=()=>{

showFavorites=!showFavorites;

showBlocked=false;

document.getElementById("favBtn")
.classList.toggle("active",showFavorites);

document.getElementById("blockedBtn")
.classList.remove("active");

render();

};


/* 拉黑页 */

document.getElementById("blockedBtn")
.onclick=()=>{

showBlocked=!showBlocked;

showFavorites=false;

document.getElementById("blockedBtn")
.classList.toggle("active",showBlocked);

document.getElementById("favBtn")
.classList.remove("active");

render();

};


/* 清空拉黑 */

document.getElementById("clearBlocked")
.onclick=()=>{

if(!blockedIds.length)return;

if(confirm("确定清空全部拉黑记录吗？")){

blockedIds=[];

saveBlocked();

render();

}

};


loadMore.onclick=()=>{
fetchPosts(false);
};


/* =========================
图片查看器
========================= */

const viewer=document.getElementById("viewer");
const viewerImg=document.getElementById("viewerImg");

let scale=1;
let posX=0;
let posY=0;

let dragging=false;
let startX=0;
let startY=0;

function updateViewer(){

viewerImg.style.transform=
`translate(calc(-50% + ${posX}px),calc(-50% + ${posY}px)) scale(${scale})`;

}

function openViewer(src){

viewer.classList.add("show");

viewerImg.src=src;

scale=1;
posX=0;
posY=0;

updateViewer();

}

function closeViewer(){

viewer.classList.remove("show");
viewerImg.src="";

}

document.getElementById("closeViewer")
.onclick=closeViewer;

viewer.onclick=e=>{

if(e.target===viewer)
closeViewer();

};


/* 双击放大 */

viewerImg.addEventListener("dblclick",()=>{

if(scale===1){

scale=2;

}else{

scale=1;
posX=0;
posY=0;

}

updateViewer();

});


/* 拖动 */

viewerImg.addEventListener("pointerdown",e=>{

dragging=true;

startX=e.clientX-posX;
startY=e.clientY-posY;

viewerImg.setPointerCapture(e.pointerId);

});

viewerImg.addEventListener("pointermove",e=>{

if(!dragging)return;

posX=e.clientX-startX;
posY=e.clientY-startY;

updateViewer();

});

viewerImg.addEventListener("pointerup",()=>{
dragging=false;
});

viewerImg.addEventListener("pointercancel",()=>{
dragging=false;
});


/* 双指缩放 */

let pinchStartDistance=0;
let pinchStartScale=1;

viewerImg.addEventListener(
"touchstart",
e=>{

if(e.touches.length===2){

e.preventDefault();

pinchStartDistance=
getDistance(
e.touches[0],
e.touches[1]
);

pinchStartScale=scale;

}

},
{passive:false}
);

viewerImg.addEventListener(
"touchmove",
e=>{

if(e.touches.length===2){

e.preventDefault();

const distance=
getDistance(
e.touches[0],
e.touches[1]
);

scale=
pinchStartScale*
(distance/pinchStartDistance);

scale=Math.max(
1,
Math.min(scale,5)
);

updateViewer();

}

},
{passive:false}
);

function getDistance(a,b){

const dx=a.clientX-b.clientX;
const dy=a.clientY-b.clientY;

return Math.sqrt(dx*dx+dy*dy);

}


/* ESC */

document.addEventListener("keydown",e=>{

if(e.key==="Escape")
closeViewer();

});


/* 开始 */

fetchPosts(true);

</script>

</body>
</html>
