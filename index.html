<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🌸 Re:Zero Girls Gallery</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101318;
  color:#eee;
  font-family:system-ui,-apple-system,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:#171a20ee;
  backdrop-filter:blur(10px);
  padding:14px;
}

h1{
  font-size:22px;
  margin:0 0 12px;
}

.bar{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:7px;
}

button,input{
  border:0;
  border-radius:10px;
  padding:10px 12px;
  background:#252a33;
  color:#fff;
}

button{
  cursor:pointer;
  white-space:nowrap;
}

button.on{
  background:#8b6cff;
}

button:disabled{
  opacity:.55;
}

input{
  width:100%;
  margin:8px 0;
}

#grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  padding:12px;
}

.card{
  background:#191d24;
  border-radius:12px;
  overflow:hidden;
}

.card img{
  width:100%;
  display:block;
  background:#0b0d10;
}

.actions{
  display:flex;
  gap:6px;
  padding:8px;
}

.actions button{
  flex:1;
  font-size:12px;
}

#more{
  display:block;
  margin:8px auto 20px;
}

#status{
  text-align:center;
  padding:10px;
  color:#aaa;
  font-size:13px;
}

#viewer{
  position:fixed;
  inset:0;
  background:#000;
  z-index:20;
  display:none;
  touch-action:none;
}

#viewer img{
  position:absolute;
  left:50%;
  top:50%;
  max-width:100vw;
  max-height:100vh;
  transform:translate(-50%,-50%);
}

#close{
  position:absolute;
  right:14px;
  top:14px;
  z-index:3;
  font-size:22px;
  background:#222c;
}

@media(min-width:700px){
  #grid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<header>

<h1>🌸 Re:Zero Girls Gallery</h1>

<!-- SFW / NSFW -->
<div class="bar" id="rating"></div>

<!-- 角色 -->
<div class="bar" id="chars"></div>

<!-- 分类 -->
<div class="bar" id="cats"></div>

<!-- 拉黑 -->
<div class="bar" id="blackbar"></div>

<input
  id="search"
  placeholder="输入标签，例如 swimsuit"
>

</header>

<div id="status">准备加载…</div>

<main id="grid"></main>

<button id="more">加载更多</button>

<!-- 图片查看器 -->
<div id="viewer">
  <button id="close">✕</button>
  <img id="vimg">
</div>


<script>

const API =
"https://danbooru.donmai.us/posts.json";

const BASE = "re:zero";


/* =========================
   角色
========================= */

const girls = {

"全部":"",

"艾米莉亚":"emilia_(re:zero)",

"蕾姆":"rem_(re:zero)",

"拉姆":"ram_(re:zero)",

"艾姬多娜":"echidna_(re:zero)",

"贝蒂":"beatrice_(re:zero)",

"菲鲁特":"felt_(re:zero)",

"库珥修":"crusch_karsten",

"阿纳斯塔西娅":"anastasia_hoshin",

"普莉希拉":"priscilla_barielle",

"弗雷德莉卡":"frederica_baumann"

};


/* =========================
   分类
========================= */

const cats = {

"全部":"",

"单人":"solo",

"多人":"multiple_girls",

"泳装":"swimsuit",

"女仆":"maid",

"和服":"kimono",

"校服":"school_uniform",

"Cosplay":"cosplay"

};


/* =========================
   当前状态
========================= */

let rating = "";

let char = "";

let cat = "";

let page = 1;

let loading = false;

let seen = new Set();

let controller = null;

let requestNo = 0;

let blackMode = false;


/* =========================
   DOM
========================= */

const $ = id =>
document.getElementById(id);

const grid = $("grid");

const status = $("status");

const more = $("more");

const search = $("search");


/* =========================
   拉黑储存
========================= */

const BLOCK_KEY =
"rezeroBlockedIds";


function getBlocked(){

  try{

    return JSON.parse(
      localStorage.getItem(BLOCK_KEY) || "[]"
    ).map(String);

  }catch{

    return [];

  }

}


function saveBlocked(list){

  localStorage.setItem(
    BLOCK_KEY,
    JSON.stringify(
      [...new Set(list.map(String))]
    )
  );

}


/* =========================
   创建按钮
========================= */

function buttons(obj,box,fn){

  for(const [name,value] of Object.entries(obj)){

    const b =
    document.createElement("button");

    b.textContent = name;

    if(!value){
      b.className = "on";
    }

    b.onclick = () => {

      box
      .querySelectorAll("button")
      .forEach(x =>
        x.classList.remove("on")
      );

      b.classList.add("on");

      fn(value);

    };

    box.appendChild(b);

  }

}


/* =========================
   SFW / NSFW
========================= */

buttons(

{

"全部":"",

"SFW":"rating:s",

"NSFW":"rating:q"

},

$("rating"),

v => {

  rating = v;

  blackMode = false;

  reset();

}

);


/* =========================
   角色
========================= */

buttons(

girls,

$("chars"),

v => {

  char = v;

  blackMode = false;

  reset();

}

);


/* =========================
   分类
========================= */

buttons(

cats,

$("cats"),

v => {

  cat = v;

  blackMode = false;

  reset();

}

);


/* =========================
   拉黑按钮
========================= */

function createBlackButtons(){

  const box =
  $("blackbar");

  box.innerHTML = "";


  const showBlocked =
  document.createElement("button");

  showBlocked.textContent =
  "🚫 已拉黑";


  showBlocked.onclick = () => {

    blackMode = true;

    reset();

  };


  const clearBlocked =
  document.createElement("button");

  clearBlocked.textContent =
  "🗑️ 清空拉黑";


  clearBlocked.onclick = () => {

    saveBlocked([]);

    blackMode = false;

    reset();

  };


  box.appendChild(showBlocked);

  box.appendChild(clearBlocked);

}

createBlackButtons();


/* =========================
   搜索
========================= */

search.oninput = () => {

  clearTimeout(
    window.searchTimer
  );

  window.searchTimer =
  setTimeout(reset,500);

};


/* =========================
   重置
========================= */

function reset(){

  if(controller){

    controller.abort();

  }

  requestNo++;

  page = 1;

  seen.clear();

  grid.innerHTML = "";

  more.disabled = false;

  more.textContent = "加载更多";

  load();

}


/* =========================
   延迟
========================= */

function sleep(ms){

  return new Promise(
    resolve => setTimeout(resolve,ms)
  );

}


/* =========================
   带超时 + 重试
========================= */

async function fetchWithTimeout(
  url,
  signal
){

  for(
    let attempt=1;
    attempt<=2;
    attempt++
  ){

    try{

      const c =
      new AbortController();

      const timer =
      setTimeout(
        () => c.abort(),
        12000
      );


      signal.addEventListener(
        "abort",
        () => c.abort(),
        {once:true}
      );


      const r =
      await fetch(
        url,
        {signal:c.signal}
      );


      clearTimeout(timer);


      if(!r.ok){

        throw Error(
          "HTTP "+r.status
        );

      }


      return await r.json();


    }catch(e){

      if(signal.aborted){

        throw e;

      }


      if(attempt===2){

        throw e;

      }


      status.textContent =
      "连接较慢，正在重试…";


      await sleep(700);

    }

  }

}


/* =========================
   加载图片
========================= */

async function load(){

  if(loading){

    return;

  }

  loading = true;

  const myRequest =
  ++requestNo;

  controller =
  new AbortController();


  more.disabled = true;


  status.textContent =
  blackMode
  ? "正在读取拉黑图片…"
  : page===1
  ? "正在加载…"
  : "正在加载更多…";


  try{

    let data = [];


    /* =====================
       已拉黑模式
    ===================== */

    if(blackMode){

      const ids =
      getBlocked();


      for(const id of ids){

        try{

          const one =
          await fetchWithTimeout(

            `${API}/${id}.json`,

            controller.signal

          );


          if(one && one.file_url){

            data.push(one);

          }

        }catch(e){

          if(e.name==="AbortError"){

            throw e;

          }

        }

      }

    }


    /* =====================
       普通模式
    ===================== */

    else{

      const tags = [

        BASE,

        char,

        rating,

        cat,

        search.value.trim()

      ]

      .filter(Boolean)

      .join(" ");


      const url =
      `${API}?limit=60&page=${page}&tags=${encodeURIComponent(tags)}`;


      data =
      await fetchWithTimeout(
        url,
        controller.signal
      );

    }


    if(myRequest!==requestNo){

      return;

    }


    let added = 0;

    const blocked =
    new Set(getBlocked());


    for(const p of data){

      if(!p.file_url){

        continue;

      }


      if(seen.has(p.id)){

        continue;

      }


      /*
        普通模式自动隐藏
        已经拉黑的图片
      */

      if(
        !blackMode &&
        blocked.has(String(p.id))
      ){

        continue;

      }


      seen.add(p.id);

      added++;


      const card =
      document.createElement("article");

      card.className =
      "card";


      card.innerHTML = `

        <img
          loading="lazy"
          src="${p.large_file_url || p.file_url}"
          alt=""
        >

        <div class="actions">

          <button class="view">
            查看
          </button>

          <button class="fav">
            ❤️ 收藏
          </button>

          <button class="block">
            🚫 拉黑
          </button>

          <button class="src">
            原帖
          </button>

        </div>

      `;


      /* 查看 */

      card
      .querySelector(".view")
      .onclick = () => {

        openViewer(
          p.large_file_url ||
          p.file_url
        );

      };


      /* 原帖 */

      card
      .querySelector(".src")
      .onclick = () => {

        location.href =
        "https://danbooru.donmai.us/posts/"
        + p.id;

      };


      /* 收藏 */

      card
      .querySelector(".fav")
      .onclick = e => {

        let list =
        JSON.parse(
          localStorage.favs || "[]"
        );


        const id =
        String(p.id);


        const index =
        list.indexOf(id);


        if(index < 0){

          list.push(id);

          e.target.textContent =
          "❤️ 已收藏";

        }else{

          list.splice(index,1);

          e.target.textContent =
          "❤️ 收藏";

        }


        localStorage.favs =
        JSON.stringify(list);

      };


      /* =====================
         拉黑
      ===================== */

      card
      .querySelector(".block")
      .onclick = () => {

        const list =
        getBlocked();


        const id =
        String(p.id);


        if(!list.includes(id)){

          list.push(id);

        }


        saveBlocked(list);


        /*
          从当前页面立即删除
        */

        card.remove();


        /*
          如果在普通模式
          就提示
        */

        status.textContent =
        "已拉黑，这张图片不会再出现在普通列表中";

      };


      grid.appendChild(card);

    }


    /* =====================
       状态
    ===================== */

    if(blackMode){

      status.textContent =
      `已拉黑 ${added} 张`;

      more.disabled = true;

      more.textContent =
      "已拉黑列表";

    }else{

      status.textContent =
      added
      ? `加载了 ${added} 张`
      : "没有找到符合条件的图片";


      page++;


      if(data.length < 60){

        more.disabled = true;

        more.textContent =
        "没有更多了";

      }else{

        more.disabled = false;

        more.textContent =
        "加载更多";

      }

    }


  }catch(e){

    if(
      e.name !== "AbortError" &&
      myRequest === requestNo
    ){

      status.textContent =
      "加载失败，可点「加载更多」重试";

      more.disabled = false;

    }

  }finally{

    if(myRequest === requestNo){

      loading = false;

      controller = null;

    }

  }

}


/* =========================
   加载更多
========================= */

more.onclick =
load;


/* =========================
   图片查看器
========================= */

const viewer =
$("viewer");

const vimg =
$("vimg");

const close =
$("close");


let scale = 1;

let dx = 0;

let dy = 0;

let sx = 0;

let sy = 0;

let lastDistance = 0;

let moving = false;


function openViewer(url){

  vimg.src = url;

  scale = 1;

  dx = 0;

  dy = 0;

  viewer.style.display =
  "block";

  applyTransform();

}


function applyTransform(){

  vimg.style.transform =
  `translate(
    calc(-50% + ${dx}px),
    calc(-50% + ${dy}px)
  ) scale(${scale})`;

}


close.onclick = () => {

  viewer.style.display =
  "none";

};


/* 双击放大 */

viewer.ondblclick = () => {

  scale =
  scale > 1
  ? 1
  : 2;

  dx = 0;

  dy = 0;

  applyTransform();

};


/* 双指缩放 / 单指拖动 */

viewer.ontouchstart = e => {

  if(e.touches.length===1){

    moving = true;

    sx =
    e.touches[0].clientX - dx;

    sy =
    e.touches[0].clientY - dy;

  }


  if(e.touches.length===2){

    lastDistance =
    Math.hypot(

      e.touches[0].clientX -
      e.touches[1].clientX,

      e.touches[0].clientY -
      e.touches[1].clientY

    );

  }

};


viewer.ontouchmove = e => {

  e.preventDefault();


  if(e.touches.length===2){

    const distance =
    Math.hypot(

      e.touches[0].clientX -
      e.touches[1].clientX,

      e.touches[0].clientY -
      e.touches[1].clientY

    );


    scale =
    Math.max(
      .5,
      Math.min(
        5,
        scale *
        distance /
        lastDistance
      )
    );


    lastDistance =
    distance;


    applyTransform();

  }


  else if(
    moving &&
    scale > 1
  ){

    dx =
    e.touches[0].clientX - sx;

    dy =
    e.touches[0].clientY - sy;

    applyTransform();

  }

};


viewer.ontouchend = () => {

  moving = false;

};


/* =========================
   启动
========================= */

load();

</script>

</body>
</html>
